apiVersion: apps/v1
kind: Deployment
metadata:
  name: clixx-app
  namespace: clixx
  labels:
    app: clixx-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clixx-app
  template:
    metadata:
      labels:
        app: clixx-app
    spec:
      containers:
        - name: clixx-app
          # DOCKER_IMAGE is replaced by Jenkins at runtime with the real ecr value
          image: DOCKER_IMAGE
          ports:
            - containerPort: 80
          env:
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: clixx-config
                  key: DB_NAME
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: clixx-config
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clixx-secrets
                  key: db_password
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: clixx-secrets
                  key: rds_endpoint
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 90
            periodSeconds: 10
        #sidecar for pods monitoring
        - name: apache-metrics-sidecar
          image: bitnami/apache-exporter:latest
          args:
            - "--scrape_uri=http://localhost/server-status/?auto"
          ports:
            - name: metrics
              containerPort: 9117
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      
